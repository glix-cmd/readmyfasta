# Pruebas automáticas de READMYFASTA en cada push y pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  motor:
    name: Motor Python (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_core.py

  navegador:
    name: Extremo a extremo (Chromium)
    runs-on: ubuntu-latest
    needs: motor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e.py --shots capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
