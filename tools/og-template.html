<!DOCTYPE html>
<!-- Plantilla de la imagen para compartir (og-image.png). Se renderiza con tools/render_icons.py -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url(../vendor/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;}
@font-face{font-family:"Source Serif 4";src:url(../vendor/fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2");font-weight:200 900;}
@font-face{font-family:"JetBrains Mono";src:url(../vendor/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#122019;
  background:radial-gradient(900px 500px at 95% 0%,rgba(15,107,102,.16),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(217,138,28,.10),transparent 60%),#F7FAF9;}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(15,107,102,.05) 0 1px,transparent 1px 28px);}
.wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:.02em}
.brand img{width:52px;height:52px;border-radius:13px;box-shadow:0 4px 14px rgba(10,77,73,.25)}
.brand b{font-weight:800}.brand span{color:#0F6B66;font-weight:500}
h1{font-family:"Source Serif 4",serif;font-weight:600;font-size:62px;line-height:1.06;letter-spacing:-.02em;margin-top:46px;max-width:760px}
p{font-size:25px;color:#4A5953;margin-top:20px;max-width:740px;line-height:1.4}
.pills{display:flex;gap:12px;margin-top:auto}
.pill{font-size:19px;font-weight:600;color:#0A4D49;background:#fff;border:1.5px solid #DCE4E0;border-radius:999px;padding:9px 18px}
.card{position:absolute;right:64px;top:150px;width:300px;background:#fff;border:1.5px solid #DCE4E0;border-radius:18px;padding:22px;box-shadow:0 18px 40px -12px rgba(16,32,26,.25)}
.card .l{font-size:14px;font-weight:600;color:#4A5953}
.card .v{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.card .v.g{color:#0B5A9C}
.bar{height:8px;border-radius:99px;background:#EDF3F1;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:72%;background:linear-gradient(90deg,#0F6B66,#0A4D49)}
.seq{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:2px;margin-top:16px;color:#7A8983}
.seq b{font-weight:500}.A{color:#2E8B74}.T{color:#C4622D}.C{color:#3B6FA0}.G{color:#8B5E9E}
</style></head><body><div class="grid"></div>
<div class="wrap">
  <div class="brand"><img src="../icon.svg" alt=""><b>READ<span>MY</span>FASTA</b></div>
  <h1>Tus datos de secuenciación, legibles en segundos</h1>
  <p>FASTA, FASTQ, BAM, CSV y PDB en el navegador. Nada sale de tu ordenador.</p>
  <div class="pills"><span class="pill">100 % local</span><span class="pill">Sin registro</span><span class="pill">Código en GitHub</span></div>
</div>
<div class="card">
  <div class="l">Bases ≥ Q30</div><div class="v">71,5 %</div>
  <div class="l">Calidad media (Phred)</div><div class="v g">31,5</div>
  <div class="l">Tamaño de genoma estimado</div><div class="v">130 kb</div>
  <div class="bar"><i></i></div>
  <div class="seq"><b class="A">A</b><b class="C">C</b><b class="G">G</b><b class="T">T</b><b class="A">A</b><b class="C">C</b><b class="G">G</b><b class="T">T</b><b class="T">T</b><b class="A">A</b><b class="G">G</b><b class="C">C</b><b class="A">A</b><b class="T">T</b><b class="G">G</b></div>
</div>
</body></html>
